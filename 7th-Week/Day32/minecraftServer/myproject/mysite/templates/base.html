{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Minecraft Server{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

    <header class="site-header">
        <div class="nav-container">

            <a class="logo" href="{% url 'home' %}">
                BlockBound
            </a>

            <nav>
                <a href="{% url 'home' %}">Home</a>
                <a href="{% url 'apply' %}">Apply</a>
                <a href="{% url 'rules' %}">Rules</a>
            </nav>

            <a class="join-link" href="{% url 'apply' %}">
                Join Community
            </a>

        </div>
    </header>


    <div class="page-background">

        <main class="main-card">
            {% block content %}
            {% endblock %}
        </main>

    </div>


    <footer class="site-footer">

        <div class="footer-content">

            <div>
                <h3>BlockBound</h3>
                <p>Build • Explore • Belong</p>
            </div>

            <p>
                A friendly Minecraft server powered by its community.
            </p>

        </div>

        <div class="footer-bottom">
            <p>Minecraft Server &copy; 2026</p>
        </div>

    </footer>

</body>

</html>
