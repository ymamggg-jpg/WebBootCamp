{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}

    <h1>Login</h1>

    <form method="POST">
        {% csrf_token %}

        <label for="username">Username</label>
        <input
            type="text"
            id="username"
            name="username"
            required
        >

        <button type="submit">Login</button>
    </form>

    <p>
        Don't have an account?
        <a href="{% url 'register' %}">Register</a>
    </p>

{% endblock %}
